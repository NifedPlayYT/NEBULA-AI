name: NEBULA Supabase function checks

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno:
    name: Type-check and test Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check deployed functions
        run: |
          deno check supabase/functions/chat/index.ts
          deno check supabase/functions/report-message/index.ts
          deno check supabase/functions/remote-config/index.ts
          deno check supabase/functions/delete-account/index.ts

      - name: Run deterministic context tests
        run: deno test supabase/functions/_shared/context_test.ts
