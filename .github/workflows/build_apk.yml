name: NEBULA Android APK

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebula-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set build version
        shell: bash
        run: |
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          VERSION_NAME="0.2.${GITHUB_RUN_NUMBER}"
          sed -i "s/versionCode = .*/versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts
          echo "NEBULA_VERSION=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Load upload keystore when configured
        env:
          KEYSTORE_B64: ${{ secrets.NEBULA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > app/nebula-release.keystore
          else
            echo "No upload keystore configured; building a test APK with the Android debug certificate."
          fi

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build release variant
        env:
          NEBULA_KEYSTORE_PASSWORD: ${{ secrets.NEBULA_KEYSTORE_PASSWORD }}
          NEBULA_KEY_ALIAS: ${{ secrets.NEBULA_KEY_ALIAS }}
          NEBULA_KEY_PASSWORD: ${{ secrets.NEBULA_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Copy APK
        run: cp app/build/outputs/apk/release/app-release.apk app-release.apk

      - name: Remove temporary signing material
        if: always()
        run: rm -f app/nebula-release.keystore

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: NEBULA-AI-${{ env.NEBULA_VERSION }}
          path: app-release.apk
          if-no-files-found: error
          retention-days: 14
