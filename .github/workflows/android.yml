name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set version
        id: version
        shell: bash
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          CODE="${GITHUB_RUN_NUMBER}"
          sed -i "s/versionCode = .*/versionCode = ${CODE}/" app/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"${VERSION}\"/" app/build.gradle.kts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_name=NEBULA-AI-v${VERSION}.apk" >> "$GITHUB_OUTPUT"
      - name: Prepare stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.NEBULA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add NEBULA_KEYSTORE_BASE64 in GitHub Actions secrets."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > app/nebula-release.keystore
      - name: Build signed release APK
        env:
          NEBULA_KEYSTORE_PASSWORD: ${{ secrets.NEBULA_KEYSTORE_PASSWORD }}
          NEBULA_KEY_ALIAS: ${{ secrets.NEBULA_KEY_ALIAS }}
        run: |
          test -n "$NEBULA_KEYSTORE_PASSWORD" || (echo "::error::Add NEBULA_KEYSTORE_PASSWORD in GitHub Actions secrets." && exit 1)
          test -n "$NEBULA_KEY_ALIAS" || (echo "::error::Add NEBULA_KEY_ALIAS in GitHub Actions secrets." && exit 1)
          gradle assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.apk_name }}"
      - name: Remove signing key from workspace
        if: always()
        run: rm -f app/nebula-release.keystore
      - name: Publish direct APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: NEBULA AI v${{ steps.version.outputs.version }}
          body: |
            NEBULA AI Android build.

            Version: ${{ steps.version.outputs.version }}
            Build: #${{ github.run_number }}
          prerelease: true
          files: ${{ steps.version.outputs.apk_name }}
